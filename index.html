        .search-icon { position: absolute; left: 14px; font-size: 1rem; color: var(--text-sub); }

        .grid-label { font-size: 0.82rem; font-weight: 700; color: var(--text-title); }

        .section-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 22px 18px; margin-bottom: 20px; }
        .section-badge { color: var(--primary); font-size: 0.75rem; font-weight: 800; letter-spacing: 1px; display: block; margin-bottom: 4px; }

</head>

            const items = branchDataStore[currentBranchKey].items;
            if (items[key]) {
                document.getElementById('admTitleInput').value = items[key].title;
                document.getElementById('admSubInput').value = items[key].sub;
                document.getElementById('editorContent').innerHTML = items[key].body;

                if (items[key].mainCat) document.getElementById('admMainCatSelect').value = items[key].mainCat;
                updateSubCatDropdowns();
                if (items[key].subCat) document.getElementById('admSubCatSelect').value = items[key].subCat;
            }
        }

        function previewCurrentEditor() {
            const title = document.getElementById('admTitleInput').value;
            const body = document.getElementById('editorContent').innerHTML;

            document.getElementById('previewModalContent').innerHTML = `
                <span class="modal-badge" style="background:#FFF1F2; color:var(--ff-orange);">PREVIEW</span>
                <h2 class="modal-title">${title}</h2>
                <div class="modal-body">${body}</div>
            `;
            document.getElementById('previewModalOverlay').classList.add('active');
        }

        function saveAdminChanges() {
            const key = document.getElementById('admItemSelect').value;
            const branch = branchDataStore[currentBranchKey];

            if (branch && branch.items[key]) {
                branch.heroTitle = document.getElementById('admBannerTitleInput').value;
                branch.heroDesc = document.getElementById('admBannerDescInput').value;

                branch.items[key].title = document.getElementById('admTitleInput').value;
                branch.items[key].sub = document.getElementById('admSubInput').value;
                branch.items[key].mainCat = document.getElementById('admMainCatSelect').value;
                branch.items[key].subCat = document.getElementById('admSubCatSelect').value;
                branch.items[key].body = document.getElementById('editorContent').innerHTML;

                localStorage.setItem('ff_branch_datastore_v2', JSON.stringify(branchDataStore));
                renderBranchView();
                alert("✓ 수정사항이 " + branch.branchName + " 프론트 화면에 성공적으로 연동 및 저장되었습니다!");
            }
        }

        function renameMainTabPrompt() {
            const oldName = document.getElementById('admManageMainTabSelect').value;
            const newName = prompt("'" + oldName + "' 대카테고리의 새 이름을 입력하세요:", oldName);
            const data = branchDataStore[currentBranchKey];

            if (newName && newName !== oldName) {
                let idx = data.masterTabs.indexOf(oldName);
                if (idx !== -1) data.masterTabs[idx] = newName;

                if (data.subCategories[oldName]) {
                    data.subCategories[newName] = data.subCategories[oldName];
                    delete data.subCategories[oldName];
                }

                Object.keys(data.items).forEach(k => {
                    if (data.items[k].mainCat === oldName) data.items[k].mainCat = newName;
                });

                localStorage.setItem('ff_branch_datastore_v2', JSON.stringify(branchDataStore));
                renderBranchView();
                alert("✓ 대카테고리 이름이 성공적으로 변경 되었습니다.");
            }
        }

        function moveMainTab(dir) {
            const oldName = document.getElementById('admManageMainTabSelect').value;
            const tabs = branchDataStore[currentBranchKey].masterTabs;
            let idx = tabs.indexOf(oldName);

            if (idx > 1 && dir === 'up') {
                [tabs[idx - 1], tabs[idx]] = [tabs[idx], tabs[idx - 1]];
            } else if (idx < tabs.length - 1 && dir === 'down') {
                [tabs[idx], tabs[idx + 1]] = [tabs[idx + 1], tabs[idx]];
            }

            localStorage.setItem('ff_branch_datastore_v2', JSON.stringify(branchDataStore));
            renderBranchView();
        }

        function renameSubCatPrompt() {
            const mainCat = document.getElementById('admManageMainTabSelect').value;
            const oldSub = document.getElementById('admManageSubCatSelect').value;
            const newSub = prompt("[" + mainCat + "] 하위의 '" + oldSub + "' 소제목 새 이름을 입력하세요:", oldSub);
            const data = branchDataStore[currentBranchKey];

            if (newSub && newSub !== oldSub) {
                let list = data.subCategories[mainCat];
                let idx = list.indexOf(oldSub);
                if (idx !== -1) list[idx] = newSub;

                Object.keys(data.items).forEach(k => {
                    if (data.items[k].mainCat === mainCat && data.items[k].subCat === oldSub) {
                        data.items[k].subCat = newSub;
                    }
                });

                localStorage.setItem('ff_branch_datastore_v2', JSON.stringify(branchDataStore));
                renderBranchView();
                alert("✓ 중카테고리 이름이 변경 되었습니다.");
            }
        }

        function moveSubCat(dir) {
            const mainCat = document.getElementById('admManageMainTabSelect').value;
            const oldSub = document.getElementById('admManageSubCatSelect').value;
            const list = branchDataStore[currentBranchKey].subCategories[mainCat];
            let idx = list.indexOf(oldSub);

            if (idx > 0 && dir === 'up') {
                [list[idx - 1], list[idx]] = [list[idx], list[idx - 1]];
            } else if (idx < list.length - 1 && dir === 'down') {
                [list[idx], list[idx + 1]] = [list[idx + 1], list[idx]];
            }

            localStorage.setItem('ff_branch_datastore_v2', JSON.stringify(branchDataStore));
            renderBranchView();
        }

        function addNewMainTabPrompt() {
            const tabName = prompt("새로 추가할 대카테고리(상단 탭) 이름을 입력하세요:", "새 구분 탭");
            const data = branchDataStore[currentBranchKey];

            if (tabName && !data.masterTabs.includes(tabName)) {
                data.masterTabs.push(tabName);
                if (!data.subCategories) data.subCategories = {};
                data.subCategories[tabName] = ['일반'];

                localStorage.setItem('ff_branch_datastore_v2', JSON.stringify(branchDataStore));
                renderBranchView();
                alert("✓ 새 대카테고리가 추가되었습니다.");
            }
        }

        function addNewSubCatPrompt() {
            const mainCat = document.getElementById('admManageMainTabSelect').value;
            const subName = prompt("[" + mainCat + "] 하위에 추가할 중카테고리(소제목) 이름을 입력하세요:", "새 소제목");
            const data = branchDataStore[currentBranchKey];

            if (subName) {
                if (!data.subCategories) data.subCategories = {};
                if (!data.subCategories[mainCat]) data.subCategories[mainCat] = [];

                if (!data.subCategories[mainCat].includes(subName)) {
                    data.subCategories[mainCat].push(subName);
                    localStorage.setItem('ff_branch_datastore_v2', JSON.stringify(branchDataStore));
                    renderBranchView();
                    alert("✓ 중카테고리가 추가되었습니다.");
                }
            }
        }

        function addNewItemPrompt() {
            const title = prompt("새 가이드 항목의 제목을 입력하세요:", "새 안내 모듈");
            const data = branchDataStore[currentBranchKey];

            if (title) {
                const newKey = 'item_' + Date.now();
                const currentMain = document.getElementById('admMainCatSelect').value || '웰컴 & 필수 가이드';
                const currentSub = document.getElementById('admSubCatSelect').value || '일반';

                data.items[newKey] = {
                    mainCat: currentMain,
                    subCat: currentSub,
                    badge: 'NEW',
                    title: title,
                    sub: '새로 추가된 안내 모듈입니다.',
                    body: '<h1>' + title + ' 상세 내용</h1><p>에디터에서 내용을 작성하세요.</p>'
                };

                localStorage.setItem('ff_branch_datastore_v2', JSON.stringify(branchDataStore));
                renderBranchView();
                document.getElementById('admItemSelect').value = newKey;
                loadItemToEditor();
                alert("✓ 새 가이드 항목이 추가되었습니다.");
            }
        }

        function deleteCurrentItem() {
            const key = document.getElementById('admItemSelect').value;
            const data = branchDataStore[currentBranchKey];

            if (key && data.items[key]) {
                if (confirm("정말로 '" + data.items[key].title + "' 항목을 삭제하시겠습니까?")) {
                    delete data.items[key];
                    localStorage.setItem('ff_branch_datastore_v2', JSON.stringify(branchDataStore));
                    renderBranchView();
                    loadItemToEditor();
                    alert("✓ 항목이 삭제되었습니다.");
                }
            }
        }

        function changePasswordPrompt() {
            const currentPw = prompt("현재 관리자 비밀번호를 입력하세요:", "");
            if (currentPw === adminPassword) {
                const newPw = prompt("새 관리자 비밀번호를 입력하세요:", "");
                if (newPw) {
                    adminPassword = newPw;
                    localStorage.setItem('ff_admin_pw', newPw);
                    alert("✓ 비밀번호가 성공적으로 변경되었습니다!");
                }
            } else if (currentPw !== null) {
                alert("현재 비밀번호가 일치하지 않습니다.");
            }
        }

        function execCmd(cmd, value=null) { document.execCommand(cmd, false, value); }
        function execColor(color) { document.execCommand('foreColor', false, color); }
        function insertLinkPrompt() {
            const url = prompt("연결할 링크 주소:", "https://");
            if (url) document.execCommand('createLink', false, url);
        }
        function insertImagePrompt() {
            const url = prompt("이미지 URL 주소:", "https://");
            if (url) document.execCommand('insertImage', false, url);
        }
    </script>
</body>
</html>
