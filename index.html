        .container { max-width: 880px; margin: 0 auto; padding: 16px; }
        .hero { background: linear-gradient(135deg, #1E3A8A 0%, #2563EB 100%); border-radius: 16px; padding: 22px 18px; color: #FFF; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }

        .grid-m { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 16px; }

        .grid-c { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 6px; text-align: center; cursor: pointer; }
        .sec-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px 14px; margin-bottom: 16px; }

        .info-i { padding: 12px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }

        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15,23,42,0.6); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 16px; }

        .modal-c { background: #FFF; border-radius: 20px; width: 100%; max-width: 640px; max-height: 85vh; overflow-y: auto; padding: 24px 20px; position: relative; }
        .modal-cls { position: absolute; top: 16px; right: 16px; border: none; background: var(--bg); width: 30px; height: 30px; border-radius: 50%; font-weight: 800; cursor: pointer; }
        .btn-act { display: inline-block; background: var(--primary); color: #FFF; font-weight: 800; padding: 10px 16px; border-radius: 8px; text-decoration: none; margin-top: 10px; font-size: 0.85rem; }

                    'credit-info': { mainCat: '크레딧 & 회의실', subCat: '크레딧 정책', badge: 'CREDIT', title: '💳 크레딧 차감 정책 & 회의실 가이드', sub: '30분당 1크레딧, 개인 1일 최대 6시간', body: '<h1>회의실 및 크레딧</h1><p>30분당 1크레딧 차감. 평일 피크타임(12~18시) 17인 이하 시간당 3크레딧 차감.</p><a href="https://credit-guide.fastfive.co.kr/" target="_blank" class="btn-act">👉 크레딧 가이드북 ↗</a>' },
                    'benefits': { mainCat: '제휴 혜택', subCat: '멤버십 전용 혜택', badge: 'BENEFIT', title: '🎁 패스트파이브 멤버 단독 제휴 혜택', sub: '경영, 업무, 피트니스, F&B 카테고리별 단독 할인', body: '<h1>멤버 단독 혜택</h1><p>AWS, Google Workspace, 네이버웍스 최대 40% 할인 및 웰니스 혜택 제공</p><a href="https://members.fastfive.co.kr/benefits" target="_blank" class="btn-act">🎁 제휴 혜택 전체보기 ↗</a>' },
                    'kitchen-fnb': { mainCat: '주차/택배/에티켓', subCat: '캔틴 & 키친', badge: 'CANTEEN', title: '☕ F&B 바, 택배 & 이용 에티켓', sub: '시리얼/우유 무료, 1:1 문의(08~22시), 건물 전체 금연', body: '<h1>캔틴 & 시설 에티켓</h1><p>• 시리얼/우유/커피 무료. 공용 냉장고 스티커 필수 부착 (금요일 18시 미부착 폐기)<br>• 메일룸 1층 위치 / 등기 및 카드는 본인 대면 수령 필수<br>• 건물 전체 절대 금연 (전자담배 포함)</p>' }
                }
            }
        };

        function loadData() {
            let keys = ['ff_branch_datastore_v2', 'ff_branch_datastore', 'ff_modal_db', 'ff_app_db'];
            for (let k of keys) {
                let d = localStorage.getItem(k);
                if (d) {
                    try {
                        let p = JSON.parse(d);
                        if (p['seolleung5'] && p['seolleung5'].items) {
                            Object.keys(p).forEach(bk => {
                                let b = p[bk];
                                if (!b.masterTabs || b.masterTabs.includes('기타')) b.masterTabs = defaultData['seolleung5'].masterTabs;
                                if (!b.subCategories) b.subCategories = defaultData['seolleung5'].subCategories;
                                Object.keys(b.items).forEach(ik => {
                                    let item = b.items[ik];
                                    if (!item.mainCat || item.mainCat === '기타') {
                                        if (ik.includes('welcome')||ik.includes('wifi')||ik.includes('door')) item.mainCat = '웰컴 & 필수 가이드';
                                        else if (ik.includes('furniture')||ik.includes('printer')) item.mainCat = '사무공간 & 비품';
                                        else if (ik.includes('credit')) item.mainCat = '크레딧 & 회의실';
                                        else if (ik.includes('benefits')) item.mainCat = '제휴 혜택';
                                        else item.mainCat = '주차/택배/에티켓';
                                    }
                                    if (!item.subCat || item.subCat === '일반') {
                                        if (ik.includes('welcome')) item.subCat = '웰컴 & 지점 안내';
                                        else if (ik.includes('wifi')||ik.includes('door')) item.subCat = '네트워크 & 출입';
                                        else if (ik.includes('furniture')) item.subCat = '사무 가구 & 전력';
                                        else if (ik.includes('printer')) item.subCat = '복합기 & OA';
                                        else if (ik.includes('credit')) item.subCat = '크레딧 정책';
                                        else if (ik.includes('benefits')) item.subCat = '멤버십 전용 혜택';
                                        else item.subCat = '캔틴 & 키친';
                                    }
                                });
                            });
                            localStorage.setItem('ff_branch_datastore_v2', JSON.stringify(p));
                            return p;
                        }
                    } catch(e) {}
                }
            }
            return defaultData;
        }

        let store = loadData();

        window.onload = function() {
            ['seolleung1','seolleung2','seolleung3','seolleung_central'].forEach(k => {
                if (!store[k]) {
                    store[k] = JSON.parse(JSON.stringify(store['seolleung5']));
                    store[k].branchName = k;
                    store[k].heroTitle = '패스트파이브 ' + k + '\n입주 멤버 안내 통합 센터';
                }
            });
            renderView();
        };

        function changeBranch(k) { currentBranchKey = k; document.getElementById('admBranchSel').value = k; renderView(); }
        function switchAdminBranch(k) { currentBranchKey = k; document.getElementById('branchSel').value = k; renderView(); loadItemToEditor(); }

        function renderView() {
            const data = store[currentBranchKey];
            document.getElementById('dispHeroTitle').innerHTML = data.heroTitle.replace('\n', '<br>');
            document.getElementById('dispHeroDesc').innerText = data.heroDesc;
            document.getElementById('admBannerTitle').value = data.heroTitle;
            document.getElementById('admBannerDesc').value = data.heroDesc;

            document.getElementById('tabsNav').innerHTML = data.masterTabs.map((t, i) => `<div class="tab-item ${i===0?'active':''}" onclick="switchCat('${t}', this)">${t}</div>`).join('');

            const grouped = {};
            Object.keys(data.items).forEach(k => {
                const item = data.items[k];
                const mc = item.mainCat || '웰컴 & 필수 가이드';
                const sc = item.subCat || '일반';
                if (!grouped[mc]) grouped[mc] = {};
                if (!grouped[mc][sc]) grouped[mc][sc] = [];
                grouped[mc][sc].push({ key: k, ...item });
            });

            let html = '';
            Object.keys(grouped).forEach(mc => {
                html += `<section class="sec-card category-sec" data-cat="${mc}"><div class="sec-h2">${mc}</div>`;
                Object.keys(grouped[mc]).forEach(sc => {
                    html += `<div class="sub-cat">${sc}</div>`;
                    grouped[mc][sc].forEach(i => {
                        html += `<div class="info-i searchable" onclick="openModal('${i.key}')"><div class="info-item-left"><div class="info-t">${i.title}</div><div class="info-s">${i.sub}</div></div><span style="color:var(--primary); font-weight:700; font-size:0.8rem;">보기 →</span></div>`;
                    });
                });
                html += `</section>`;
            });
            document.getElementById('sectionsContainer').innerHTML = html;
            populateAdminDropdowns();
        }

        function switchCat(cat, el) {
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            document.querySelectorAll('.category-sec').forEach(sec => {
                sec.style.display = (cat === '전체보기' || sec.getAttribute('data-cat') === cat) ? 'block' : 'none';
            });
        }

        function openModal(k) {
            const d = store[currentBranchKey].items[k];
            if (!d) return;
            document.getElementById('modalContent').innerHTML = `<span class="modal-badge">${d.badge}</span><h2 class="modal-title">${d.title}</h2><div class="modal-body">${d.body}</div>`;
            document.getElementById('modalOverlay').classList.add('active');
        }
        function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }
        function closeAdmin() { document.getElementById('adminModalOverlay').classList.remove('active'); }
        function closePreview() { document.getElementById('previewModalOverlay').classList.remove('active'); }

        function filterContent() {
            const q = document.getElementById('searchInput').value.toLowerCase().trim();
            document.querySelectorAll('.searchable').forEach(i => { i.style.display = i.innerText.toLowerCase().includes(q) ? 'flex' : 'none'; });
        }

        function triggerSecretLogin() {
            if (prompt("관리자 비밀번호를 입력하세요.") === adminPassword) {
                document.getElementById('adminModalOverlay').classList.add('active');
                document.getElementById('admBranchSel').value = currentBranchKey;
                populateAdminDropdowns();
                loadItemToEditor();
            } else alert("비밀번호가 올바르지 않습니다.");
        }

        function populateAdminDropdowns() {
            const items = store[currentBranchKey].items;
            document.getElementById('admItemSel').innerHTML = Object.keys(items).map(k => `<option value="${k}">[${items[k].mainCat} > ${items[k].subCat}] ${items[k].title}</option>`).join('');
            
            const tabs = store[currentBranchKey].masterTabs.filter(t => t !== '전체보기');
            document.getElementById('manageMainCat').innerHTML = tabs.map(t => `<option value="${t}">${t}</option>`).join('');
            document.getElementById('admMainCatSel').innerHTML = tabs.map(t => `<option value="${t}">${t}</option>`).join('');
            
            updateManageSubCat();
            updateEditorSubCat();
        }

        function updateManageSubCat() {
            const mc = document.getElementById('manageMainCat').value;
            const subs = (store[currentBranchKey].subCategories && store[currentBranchKey].subCategories[mc]) || ['일반'];
            document.getElementById('manageSubCat').innerHTML = subs.map(s => `<option value="${s}">${s}</option>`).join('');
        }

        function updateEditorSubCat() {
            const mc = document.getElementById('admMainCatSel').value;
            const subs = (store[currentBranchKey].subCategories && store[currentBranchKey].subCategories[mc]) || ['일반'];
            document.getElementById('admSubCatSel').innerHTML = subs.map(s => `<option value="${s}">${s}</option>`).join('');
        }

        function loadItemToEditor() {
            const k = document.getElementById('admItemSel').value;
            const item = store[currentBranchKey].items[k];
            if (item) {
                document.getElementById('admTitleIn').value = item.title;
                document.getElementById('admSubIn').value = item.sub;
                document.getElementById('editorContent').innerHTML = item.body;
                if (item.mainCat) document.getElementById('admMainCatSel').value = item.mainCat;
                updateEditorSubCat();
                if (item.subCat) document.getElementById('admSubCatSel').value = item.subCat;
            }
        }

        function saveAdminChanges() {
            const k = document.getElementById('admItemSel').value;
            const b = store[currentBranchKey];
            if (b && b.items[k]) {
                b.heroTitle = document.getElementById('admBannerTitle').value;
                b.heroDesc = document.getElementById('admBannerDesc').value;
                b.items[k].title = document.getElementById('admTitleIn').value;
                b.items[k].sub = document.getElementById('admSubIn').value;
                b.items[k].mainCat = document.getElementById('admMainCatSel').value;
                b.items[k].subCat = document.getElementById('admSubCatSel').value;
                b.items[k].body = document.getElementById('editorContent').innerHTML;

                localStorage.setItem('ff_branch_datastore_v2', JSON.stringify(store));
                renderView();
                alert("✓ 수정사항이 무사히 저장되었습니다!");
            }
        }

        function previewEditor() {
            document.getElementById('previewContent').innerHTML = `<span class="modal-badge">PREVIEW</span><h2>${document.getElementById('admTitleIn').value}</h2><div class="modal-body">${document.getElementById('editorContent').innerHTML}</div>`;
            document.getElementById('previewModalOverlay').classList.add('active');
        }

        function renameMainTabPrompt() {
            const oldN = document.getElementById('manageMainCat').value;
            const newN = prompt("대카테고리 새 이름:", oldN);
            if (newN && newN !== oldN) {
                let data = store[currentBranchKey];
                let idx = data.masterTabs.indexOf(oldN);
                if (idx !== -1) data.masterTabs[idx] = newN;
                if (data.subCategories[oldN]) { data.subCategories[newN] = data.subCategories[oldN]; delete data.subCategories[oldN]; }
                Object.keys(data.items).forEach(k => { if (data.items[k].mainCat === oldN) data.items[k].mainCat = newN; });
                localStorage.setItem('ff_branch_datastore_v2', JSON.stringify(store));
                renderView();
            }
        }

        function moveMainTab(dir) {
            const oldN = document.getElementById('manageMainCat').value;
            const tabs = store[currentBranchKey].masterTabs;
            let idx = tabs.indexOf(oldN);
            if (idx > 1 && dir === 'up') [tabs[idx - 1], tabs[idx]] = [tabs[idx], tabs[idx - 1]];
            else if (idx < tabs.length - 1 && dir === 'down') [tabs[idx], tabs[idx + 1]] = [tabs[idx + 1], tabs[idx]];
            localStorage.setItem('ff_branch_datastore_v2', JSON.stringify(store));
            renderView();
        }

        function renameSubCatPrompt() {
            const mc = document.getElementById('manageMainCat').value;
            const oldS = document.getElementById('manageSubCat').value;
            const newS = prompt("[" + mc + "] 중카테고리 새 이름:", oldS);
            if (newS && newS !== oldS) {
                let data = store[currentBranchKey];
                let list = data.subCategories[mc];
                let idx = list.indexOf(oldS);
                if (idx !== -1) list[idx] = newS;
                Object.keys(data.items).forEach(k => { if (data.items[k].mainCat === mc && data.items[k].subCat === oldS) data.items[k].subCat = newS; });
                localStorage.setItem('ff_branch_datastore_v2', JSON.stringify(store));
                renderView();
            }
        }

        function moveSubCat(dir) {
            const mc = document.getElementById('manageMainCat').value;
            const oldS = document.getElementById('manageSubCat').value;
            const list = store[currentBranchKey].subCategories[mc];
            let idx = list.indexOf(oldS);
            if (idx > 0 && dir === 'up') [list[idx - 1], list[idx]] = [list[idx], list[idx - 1]];
            else if (idx < list.length - 1 && dir === 'down') [list[idx], list[idx + 1]] = [list[idx + 1], list[idx]];
            localStorage.setItem('ff_branch_datastore_v2', JSON.stringify(store));
            renderView();
        }

        function addMainTabPrompt() {
            const tabName = prompt("새 대카테고리 이름:", "새 구분 탭");
            if (tabName && !store[currentBranchKey].masterTabs.includes(tabName)) {
                store[currentBranchKey].masterTabs.push(tabName);
                store[currentBranchKey].subCategories[tabName] = ['일반'];
                localStorage.setItem('ff_branch_datastore_v2', JSON.stringify(store));
                renderView();
            }
        }

        function addSubCatPrompt() {
            const mc = document.getElementById('manageMainCat').value;
            const subName = prompt("[" + mc + "] 새 중카테고리 이름:", "새 소제목");
            if (subName) {
                if (!store[currentBranchKey].subCategories[mc]) store[currentBranchKey].subCategories[mc] = [];
                store[currentBranchKey].subCategories[mc].push(subName);
                localStorage.setItem('ff_branch_datastore_v2', JSON.stringify(store));
                renderView();
            }
        }

        function addNewItemPrompt() {
            const title = prompt("새 가이드 항목 제목:", "새 안내 모듈");
            if (title) {
                const k = 'item_' + Date.now();
                const mc = document.getElementById('admMainCatSel').value || '웰컴 & 필수 가이드';
                const sc = document.getElementById('admSubCatSel').value || '일반';
                store[currentBranchKey].items[k] = { mainCat: mc, subCat: sc, badge: 'NEW', title: title, sub: '새로 추가된 항목입니다.', body: '<h1>' + title + '</h1><p>내용을 작성하세요.</p>' };
                localStorage.setItem('ff_branch_datastore_v2', JSON.stringify(store));
                renderView();
                document.getElementById('admItemSel').value = k;
                loadItemToEditor();
            }
        }

        function deleteCurrentItem() {
            const k = document.getElementById('admItemSel').value;
            if (k && confirm("정말 삭제하시겠습니까?")) {
                delete store[currentBranchKey].items[k];
                localStorage.setItem('ff_branch_datastore_v2', JSON.stringify(store));
                renderView();
                loadItemToEditor();
            }
        }

        function changePasswordPrompt() {
            const oldP = prompt("현재 비밀번호:");
            if (oldP === adminPassword) {
                const newP = prompt("새 비밀번호:");
                if (newP) { adminPassword = newP; localStorage.setItem('ff_admin_pw', newP); alert("비밀번호 변경 완료!"); }
            } else if (oldP) alert("비밀번호가 틀렸습니다.");
        }

        function execCmd(c, v=null) { document.execCommand(c, false, v); }
        function execColor(c) { document.execCommand('foreColor', false, c); }
        function promptLink() { const u = prompt("링크 주소:"); if(u) document.execCommand('createLink', false, u); }
        function promptImg() { const u = prompt("이미지 주소:"); if(u) document.execCommand('insertImage', false, u); }
    </script>
</body>
</html>
